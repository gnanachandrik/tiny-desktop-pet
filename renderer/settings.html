<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><link rel="stylesheet" href="settings.css"></head><body><header><h1>Little Pet Settings</h1><p>Make your desktop companion feel right for you.</p></header><form id="settings"><label class="toggle"><input id="enabled" type="checkbox"> Enable pet</label><label>Visit frequency<select id="visitMinutes"><option value="5">Every 5 minutes</option><option value="10">Every 10 minutes</option><option value="15">Every 15 minutes</option><option value="30">Every 30 minutes</option><option value="60">Every hour</option><option value="custom">Custom…</option></select></label><label id="customRow" hidden>Custom visit interval (minutes)<input id="customVisitMinutes" type="number" min="1" max="1440"></label><label>Water reminder frequency<select id="waterMinutes"><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option><option value="90">90 minutes</option><option value="120">2 hours</option><option value="0">Off</option></select></label><label class="toggle"><input id="checkins" type="checkbox"> Check-ins on</label><label class="toggle"><input id="sound" type="checkbox"> Sound on</label><label>Animation speed <span id="speedLabel">1×</span><input id="animationSpeed" type="range" min="0.5" max="2" step="0.1"></label><label>Pet size<select id="petSize"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label><label class="toggle"><input id="aiEnabled" type="checkbox"> AI chat (requires API key)</label><label>OpenAI API key<input id="apiKey" type="password" autocomplete="off" placeholder="Paste key here; stored encrypted when supported"><small id="keyStatus"></small></label><label class="toggle"><input id="launchAtLogin" type="checkbox"> Launch when computer starts</label><label class="toggle"><input id="alwaysOnTop" type="checkbox"> Always on top</label><label class="toggle"><input id="quietHoursEnabled" type="checkbox"> Quiet hours enabled</label><div class="times"><label>Quiet start<input id="quietStart" type="time"></label><label>Quiet end<input id="quietEnd" type="time"></label></div><div class="actions"><button type="button" id="pause30">Pause 30 min</button><button type="button" id="pause60">Pause 1 hour</button><button type="button" id="pauseTomorrow">Pause until tomorrow</button><button type="button" id="resume">Resume</button></div><button class="save" type="submit">Save settings</button><button type="button" id="bringback" class="secondary">Bring pet and button on screen</button><p id="status" role="status"></p><p class="foot">Your settings are saved on this computer. AI mode sends your chat text to OpenAI when enabled.</p></form><script src="settings.js"></script></body></html>
